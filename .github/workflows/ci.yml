name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify the build contains no external URLs
        run: |
          set -euo pipefail
          if grep -rEo 'https?://[^"'"'"' )]+' dist/ --include='*.js' --include='*.html' --include='*.css' \
            | grep -vE 'https://github\.com/|http://www\.w3\.org/|https://react\.dev/' ; then
            echo "Unexpected external URL found in dist/"; exit 1
          fi
          echo "dist/ contains no unexpected external URLs"
